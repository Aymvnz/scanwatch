# Render blueprint for the Python API. The frontend deploys separately on Vercel.
services:
  - type: web
    name: scanwatch-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SCANWATCH_CORS
        sync: false   # set to your Vercel URL, e.g. https://scanwatch.vercel.app
